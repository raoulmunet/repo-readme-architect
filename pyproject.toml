[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="repo-readme-architect"
version="0.1.0"
description="Generate README starters from repository structure."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Raoul Munet"}]
dependencies=[]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
repo-readme-architect="repo_readme_architect.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
